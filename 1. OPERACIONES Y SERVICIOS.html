<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP CARZE | Operaciones y Servicios</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('carze_theme')||'dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1);--or:#FF5B00;--or2:#FF6B00;--blue:#0048A8;--nv:#0B2545;--blue-soft:#E8F0FC;--ink:#0B2545;--muted:#5F6F87;--line:#E3E9F2;--bg:#F2F5FA;--sf:#fff;--sf2:#F6F8FC;--fld:#fff;--thbg:#0B2545;--hv:rgba(0,72,168,.045);--sh:0 1px 2px rgba(11,37,69,.06),0 10px 28px -14px rgba(11,37,69,.16);--ok:#0E8F5E;--okb:rgba(14,143,94,.12);--er:#D6384A;--erb:rgba(214,56,74,.1);--wn:#C24A00;--wnb:rgba(255,91,0,.12);--bl:#0048A8;--blb:rgba(0,72,168,.1);--glow:.5;color-scheme:light}
[data-theme=dark]{--blue:#6AA5FF;--blue-soft:rgba(106,165,255,.12);--ink:#E8EDF6;--muted:#8D9BB3;--line:rgba(255,255,255,.08);--bg:#0B0F17;--sf:rgba(22,29,44,.72);--sf2:rgba(255,255,255,.035);--fld:rgba(255,255,255,.04);--thbg:#12264A;--hv:rgba(255,255,255,.035);--sh:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px -18px rgba(0,0,0,.8);--ok:#3DD598;--okb:rgba(61,213,152,.12);--er:#FF6B7A;--erb:rgba(255,107,122,.12);--wn:#FF8A3D;--wnb:rgba(255,91,0,.16);--bl:#7FB0FF;--blb:rgba(106,165,255,.14);--glow:1;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--glow);background:radial-gradient(620px 340px at 88% -4%,rgba(255,91,0,.13),transparent 70%),radial-gradient(760px 420px at 12% -6%,rgba(0,72,168,.2),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
i[data-i]{display:inline-flex;font-style:normal;flex:none;vertical-align:middle}.ic{flex:none;display:block}
.app{display:flex;min-height:100vh;position:relative}
.sidebar{width:248px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,#0B2545,#08182F);color:#fff;padding:20px 12px;border-right:1px solid rgba(255,255,255,.06)}
[data-theme=dark] .sidebar{background:linear-gradient(180deg,#0A1730,#070D19)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand svg{width:44px;height:44px;filter:drop-shadow(0 0 12px rgba(255,91,0,.45))}
.brand b{display:block;font-size:22px;font-weight:800;letter-spacing:.5px;line-height:1;text-shadow:2px 2px 0 #1f5fc4}
.brand small{display:block;font-size:8.5px;letter-spacing:1.3px;color:#9FB6D8;margin-top:5px;white-space:nowrap}
.nav-label{color:#6F86A9;font-size:10px;font-weight:800;letter-spacing:1.6px;padding:14px 12px 7px}
.nav{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:#BFD0E8;text-align:left;margin:2px 0;font-weight:500;transition:background .15s ease,color .15s ease,transform .12s var(--ease)}
.nav:active{transform:scale(.98)}
.nav.active{background:linear-gradient(90deg,rgba(255,91,0,.2),rgba(255,91,0,.04));color:#fff;font-weight:700}
.nav.active::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--or);box-shadow:0 0 12px var(--or)}
.nav.active .ico{color:var(--or2)}.ico{display:grid;place-items:center}
@media(hover:hover) and (pointer:fine){.nav:not(.active):hover{background:rgba(255,255,255,.06);color:#fff}}
.sidebar-foot{margin:26px 8px 0;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;color:#6F86A9;font-size:11px}
.main{flex:1;min-width:0;position:relative}
.topbar{position:sticky;top:0;z-index:20;height:66px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 28px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumb{color:var(--muted);font-size:12px}.topbar strong{font-size:14px}.tl{min-width:0}.tl div,.tl strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg{position:relative;flex:1;max-width:380px}.sg .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sg input{width:100%;padding:10px 40px 10px 38px}
kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font:600 11px 'Plus Jakarta Sans';border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;color:var(--muted);background:var(--sf2)}
.tr{display:flex;align-items:center;gap:10px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--okb);color:var(--ok);white-space:nowrap}.sync.off{background:var(--wnb);color:var(--wn)}
.sq{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:var(--sf);color:var(--muted);transition:transform .12s var(--ease),color .15s ease,border-color .15s ease}.sq:active{transform:scale(.94)}
.sq .i-sun{display:none}[data-theme=dark] .sq .i-sun{display:inline-flex}[data-theme=dark] .sq .i-moon{display:none}
@media(hover:hover) and (pointer:fine){.sq:hover{color:var(--or);border-color:rgba(255,91,0,.5)}}
.avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--bl),var(--or));color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.content{padding:28px;max-width:1600px;margin:auto}
.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}
.eyebrow{color:var(--or);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px}
.heading h1{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:5px 0;overflow-wrap:anywhere}.heading p{margin:0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--sf2);color:var(--ink);border-radius:11px;padding:10px 15px;font-weight:700;white-space:nowrap;transition:transform .14s var(--ease),box-shadow .2s ease,background .15s ease,border-color .15s ease}
.btn:active{transform:scale(.97)}
.btn.primary{border:0;color:#fff;background:linear-gradient(180deg,var(--or2),var(--or));box-shadow:0 8px 20px -8px rgba(255,91,0,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.soft{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.btn.danger{color:var(--er);background:var(--erb);border-color:transparent}
.btn.small{padding:6px 10px;font-size:12px;border-radius:9px}
@media(hover:hover) and (pointer:fine){.btn.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px -8px rgba(255,91,0,.8),inset 0 1px 0 rgba(255,255,255,.25)}.btn:not(.primary):hover{border-color:rgba(255,91,0,.45)}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{position:relative;overflow:hidden;min-width:0;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--sf);backdrop-filter:blur(14px);box-shadow:var(--sh);transition:transform .2s var(--ease),box-shadow .2s ease,border-color .2s ease;--kc:#FF5B00}
.stats .stat:nth-child(2){--kc:#3B82F6}.stats .stat:nth-child(3){--kc:#18B77E}.stats .stat:nth-child(4){--kc:#8B7CF6}
.stat::after{content:"";position:absolute;right:-30px;top:-40px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--kc),transparent 70%);opacity:.17;pointer-events:none}
.stat-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600}.stat-top>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-icon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--kc) 16%,transparent);color:var(--kc)}
.stat strong{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stat small{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(hover:hover) and (pointer:fine){.stat:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--kc) 45%,var(--line));box-shadow:0 18px 36px -18px rgba(0,0,0,.5)}}
.panel{border:1px solid var(--line);border-radius:18px;background:var(--sf);backdrop-filter:blur(14px);box-shadow:var(--sh);overflow:hidden;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:15px;font-weight:800;margin:0}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
.filters{display:flex;gap:9px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:12px;color:var(--muted);font-weight:700}
input:not([type=checkbox]),select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--fld);min-width:0;width:100%;color:var(--ink);outline:0;transition:border-color .15s ease,box-shadow .15s ease}
select option{background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--or)!important;box-shadow:0 0 0 3px rgba(255,91,0,.18)}
input:disabled{opacity:.6}textarea{resize:vertical;max-height:180px}
input[type=file]{padding:7px}input[type=file]::file-selector-button{border:0;border-radius:7px;padding:5px 10px;margin-right:10px;background:var(--blue-soft);color:var(--blue);font-weight:700;cursor:pointer}
.filters .field{width:210px}.filters .field.search{flex:1;min-width:220px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{position:sticky;top:0;background:var(--thbg);color:#DCE7F7;font-size:11px;text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:13px 16px;font-weight:700}
td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}tbody tr{transition:background .15s ease}tbody tr:hover{background:var(--hv)}
tbody tr[onclick]{cursor:pointer}
.cell{display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.wide{max-width:420px}.cell.exp{cursor:pointer}.cell.exp.open{white-space:normal;overflow-wrap:anywhere;max-width:420px}
.code{font-weight:800;color:var(--blue)}.client{font-weight:700}.subtext{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.reg{background:var(--sf2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.status.pending{background:var(--wnb);color:var(--wn)}.status.ready{background:var(--blb);color:var(--bl)}.status.billed,.status.ok{background:var(--okb);color:var(--ok)}.status.cancel{background:var(--erb);color:var(--er)}
.progress{display:flex;align-items:center;gap:8px;min-width:110px}.progress b{font-size:12px}
.track{height:7px;width:72px;border-radius:8px;background:var(--sf2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.track span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--or),#FFA45C);box-shadow:0 0 10px rgba(255,91,0,.5)}
.actions{display:flex;gap:5px}
.icon-btn{display:grid;place-items:center;border:1px solid var(--line);background:var(--sf2);border-radius:9px;width:30px;height:30px;color:var(--muted);transition:color .15s ease,background .15s ease,transform .12s var(--ease)}
.icon-btn:active{transform:scale(.92)}.icon-btn:hover{background:var(--blue-soft);color:var(--or)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.footer-note{padding:13px 20px;background:var(--sf2);border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.badge{border-radius:7px;background:var(--sf2);box-shadow:inset 0 0 0 1px var(--line);padding:4px 8px;color:var(--muted);font-size:10.5px;font-weight:800;white-space:nowrap}.badge.up{background:var(--okb);color:var(--ok);box-shadow:none}
.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}
.detail-main,.detail-side{border:1px solid var(--line);border-radius:18px;background:var(--sf);backdrop-filter:blur(14px);box-shadow:var(--sh);overflow:hidden;min-width:0;align-self:start}
.detail-title{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:15px}
.detail-title>div{min-width:0}.detail-title h2{margin:0;font-size:19px;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.detail-title p{margin:5px 0 0;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);overflow:auto;scrollbar-width:none}
.tab{position:relative;padding:14px 12px;border:0;background:transparent;color:var(--muted);white-space:nowrap;font-size:12.5px;font-weight:700;transition:color .15s ease}
.tab.active{color:var(--ink)}.tab.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--or);box-shadow:0 0 10px var(--or)}
.fx .tab.active::after{animation:line .3s var(--ease)}@keyframes line{from{transform:scaleX(.2);opacity:0}}
.detail-body{padding:20px}
.fx .detail-body{animation:tin .26s var(--ease)}@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.section-title{font-size:14px;font-weight:800;margin:0 0 15px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.form-grid .wide{grid-column:1/-1}.hint{font-size:11px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.doc-list{display:grid;gap:9px}
.doc-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--sf2);transition:border-color .15s ease,transform .18s var(--ease)}
.doc-icon{width:38px;height:38px;border-radius:11px;background:var(--blb);color:var(--bl);display:grid;place-items:center;flex-shrink:0}
.doc-row .doc-info{flex:1;min-width:0}.doc-info strong{font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-info small{display:block;color:var(--muted);margin-top:3px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-info a{display:inline-flex;align-items:center;gap:4px}.upload-label{cursor:pointer}
@media(hover:hover) and (pointer:fine){.doc-row:hover{border-color:rgba(255,91,0,.4);transform:translateX(2px)}}
.side-block{padding:17px;border-bottom:1px solid var(--line)}.side-block:last-child{border:0}.side-block h3{font-size:12px;font-weight:800;margin:0 0 12px;letter-spacing:.3px}
.side-block .track{height:9px}
.side-stat{display:flex;justify-content:space-between;gap:10px;margin:10px 0;font-size:12px}.side-stat span{color:var(--muted)}.side-stat strong{text-align:right;overflow-wrap:anywhere;min-width:0}
.callout{padding:12px;border-radius:12px;background:var(--blb);color:var(--bl);font-size:11.5px}
.category-list{display:flex;flex-wrap:wrap;gap:7px}
.category-chip{border:1px solid var(--line);padding:7px 10px;border-radius:9px;font-size:11.5px;background:var(--sf2);display:flex;gap:7px;align-items:center;max-width:100%;overflow-wrap:anywhere}
.category-chip button{border:0;background:transparent;color:var(--er);display:grid;place-items:center}
.modal-backdrop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(4,10,22,.5);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:opacity .16s ease,visibility 0s .16s}
.modal-backdrop.show{opacity:1;visibility:visible;transition:opacity .22s var(--ease),visibility 0s}
.modal{width:min(640px,100%);max-height:90vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:0 40px 100px -20px rgba(0,0,0,.6);transform:scale(.96) translateY(6px);transition:transform .16s var(--ease)}
[data-theme=dark] .modal{background:#101725}
.modal-backdrop.show .modal{transform:none;transition:transform .26s var(--ease)}
.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h2{font-size:18px;font-weight:800;margin:0;overflow-wrap:anywhere}.modal-body{padding:22px;overflow:auto}
.modal-foot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
#toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:grid;gap:10px;justify-items:end}
.toast{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;max-width:min(380px,90vw);padding:13px 18px;border-radius:13px;background:#0B2545;color:#fff;font-weight:600;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 50px -12px rgba(0,0,0,.55);transform:translateY(10px) scale(.97);opacity:0;transition:transform .16s ease,opacity .16s ease}
.toast.in{transform:none;opacity:1;transition:transform .34s cubic-bezier(.34,1.45,.64,1),opacity .2s ease}
.toast .ic{color:#3DD598}.toast.err .ic{color:#FF8A3D}.toast span{overflow-wrap:anywhere}
.toast .life{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--or);transform-origin:left;animation:life 2.8s linear forwards}@keyframes life{to{transform:scaleX(0)}}
.cele{position:fixed;top:22px;left:50%;z-index:100;transform:translateX(-50%);pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.cele-card{position:relative;display:flex;align-items:center;gap:16px;padding:16px 26px 18px 18px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#0B2545,#0048A8);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 70px -14px rgba(0,72,168,.7),0 0 0 1px rgba(255,91,0,.4),0 0 40px -6px rgba(255,91,0,.5);animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
.cele.out .cele-card{animation:none;transform:translateY(-14px) scale(.96);opacity:0;transition:transform .2s ease,opacity .2s ease}
@keyframes pop{0%{opacity:0;transform:translateY(-30px) scale(.8)}100%{opacity:1;transform:none}}
.cele-ic{position:relative;width:52px;height:52px;flex:none}
.cele-ic svg{width:52px;height:52px;fill:rgba(61,213,152,.16);stroke:#3DD598;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.cele-ic circle{stroke-dasharray:152;stroke-dashoffset:152;animation:draw .5s .1s var(--ease) forwards}
.cele-ic path{stroke-dasharray:40;stroke-dashoffset:40;fill:none;animation:draw .35s .4s var(--ease) forwards}@keyframes draw{to{stroke-dashoffset:0}}
.cele-ic s{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#FF6B00;opacity:0;animation:spark .8s .25s var(--ease) both}
.cele-ic s:nth-of-type(even){background:#8FBAFF;width:4px;height:4px}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(-26px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-58px) scale(.2)}}
.cele-tx b{display:block;font-size:16px;font-weight:800;overflow-wrap:anywhere}.cele-tx small{display:block;color:#B6CBEA;margin-top:2px;font-size:12px}
.cele-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;border-radius:0 0 20px 20px;background:var(--or);transform-origin:left;animation:life 3.6s linear forwards}
#tip{position:fixed;z-index:90;max-width:360px;padding:8px 11px;border-radius:9px;background:#0B2545;color:#fff;font-size:12px;font-weight:500;overflow-wrap:anywhere;pointer-events:none;border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 30px -8px rgba(0,0,0,.5);opacity:0;transform:translateY(3px);transition:opacity .125s ease,transform .125s var(--ease)}#tip.show{opacity:1;transform:none}
.hidden{display:none!important}.muted{color:var(--muted)}
.mini-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--sf2);min-width:0}.mini-card strong{display:block;font-size:19px;margin-top:4px;overflow:hidden;text-overflow:ellipsis}.mini-card span{color:var(--muted);font-size:11.5px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.observation{border:1px solid rgba(255,91,0,.35);background:var(--wnb);border-radius:13px;padding:14px}
.fx .stat,.fx .panel,.fx .detail-main,.fx .detail-side,.fx .heading{animation:rise .42s var(--ease) both}
.fx .stats .stat:nth-child(2){animation-delay:50ms}.fx .stats .stat:nth-child(3){animation-delay:100ms}.fx .stats .stat:nth-child(4){animation-delay:150ms}.fx .panel{animation-delay:120ms}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.fx tbody tr,tbody.stg tr{animation:rise .26s var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
.fx .track span{animation:grow .7s .15s var(--ease) both}@keyframes grow{from{width:0}}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.detail-layout{grid-template-columns:1fr}.sync{display:none}}
@media(max-width:760px){.sidebar{width:68px;padding:16px 8px}.brand{padding:0 5px 22px}.brand div,.nav-label,.nav .nav-text,.sidebar-foot{display:none}.nav{justify-content:center}.nav.active::before{display:none}.topbar{padding:0 14px}.content{padding:18px 14px}.heading{flex-direction:column}.stats{gap:8px}.form-grid,.two-col{grid-template-columns:1fr}.filters .field{width:100%}.filters .field.search{min-width:100%}.doc-row{flex-wrap:wrap}.sg kbd,.tl div{display:none}.cele-card{padding:14px 18px 16px 14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M41 15A19.5 19.5 0 1 0 40 31" fill="none" stroke="#FF5B00" stroke-width="3.6" stroke-linecap="round"/><path d="M28 5 12.5 27H22l-6 17 19-24h-9.5z" fill="#FF5B00"/></svg><div><b>CARZE</b><small>CONTRATISTAS GENERALES</small></div></div>
  <div class="nav-label">MENÚ PRINCIPAL</div>
  <button class="nav" data-view="dashboard"><span class="ico"><i data-i="dash"></i></span><span class="nav-text">Dashboard</span></button>
  <button class="nav" data-view="crm"><span class="ico"><i data-i="users"></i></span><span class="nav-text">CRM</span></button>
  <div class="nav-label">OPERACIONES</div>
  <button class="nav active" data-view="projects"><span class="ico"><i data-i="folder"></i></span><span class="nav-text">Proyectos</span></button>
  <button class="nav" data-view="certificates"><span class="ico"><i data-i="filecheck"></i></span><span class="nav-text">Certificados</span></button>
  <button class="nav" data-view="budgets"><span class="ico"><i data-i="sheet"></i></span><span class="nav-text">Presupuestos</span></button>

</aside>
<main class="main">
<header class="topbar"><div class="tl"><div class="crumb">ERP CARZE / <span id="crumb">Operaciones y Servicios</span></div><strong id="top-title">Control operativo de servicios</strong></div>
<div class="sg"><i data-i="search" data-s="16"></i><input id="gsearch" placeholder="Búsqueda global…" maxlength="120" autocomplete="off"><kbd>/</kbd></div>
<div class="tr"><span class="sync" id="sync"></span><button class="sq" id="theme" aria-label="Cambiar tema"><span class="i-sun"><i data-i="sun"></i></span><span class="i-moon"><i data-i="moon"></i></span></button><div class="avatar" title="Usuario">RC</div></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modal-title">Nuevo registro</h2><button class="sq" onclick="closeModal()" aria-label="Cerrar"><i data-i="x"></i></button></div><div class="modal-body" id="modal-body"></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="modal-save">Guardar</button></div></div></div>
<div id="toasts" aria-live="polite"></div><div id="tip"></div>
<script>

const ICONS={dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',filecheck:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M9 15l2 2 4-4"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',sheet:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',receipt:'<path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 1V2l-1 1-3-2-3 2-3-2-3 2Z"/><path d="M8 8h8M8 12h8"/>',swap:'<path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/>',plus:'<path d="M5 12h14M12 5v14"/>',back:'<path d="m12 19-7-7 7-7M19 12H5"/>','arrow-r':'<path d="M5 12h14M12 5l7 7-7 7"/>',open:'<path d="M7 17 17 7M7 7h10v10"/>',pencil:'<path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',settings:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',hash:'<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',check:'<path d="m5 12 5 5L20 7"/>',alert:'<path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3ZM12 9v4M12 17h.01"/>',trend:'<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',coins:'<circle cx="9" cy="9" r="7"/><path d="M15.5 9.8A7 7 0 1 1 9.8 15.5"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
const hydrate=()=>document.querySelectorAll('i[data-i]:empty').forEach(e=>e.innerHTML=ic(e.dataset.i,+e.dataset.s||18));
const state={
 view:'projects', selected:null, tab:'general', certTab:'general',
 clients:['Tottus','Sodimac','Maestro','Cliente de ejemplo'],
 zones:['Lima','Sullana','Piura','Piura Norte','Chiclayo','Ferreñafe'],
 responsibles:['María López','Carlos Pérez','Ana Torres','José Ramírez'],
 categories:['Materiales','Transporte y movilidad','Mano de obra','Herramientas y equipos','Alimentación y viáticos','Otros gastos'],
 projects:[
 {id:'PRO-0001',client:'Tottus',zone:'Lima',store:'Tottus Lima Centro',responsible:'María López',description:'Mantenimiento y servicio general',type:'Servicio',quote:2500,estimate:1500,status:'Listo para facturar',docs:{quote:true,budget:true,report:true,act:true,oc:true,cert:false,migo:'123456'},required:{quote:true,budget:true,report:true,act:true,oc:true,cert:false},docFiles:{},expenses:[{date:'2026-10-10',category:'Materiales',description:'Materiales de instalación',amount:350},{date:'2026-10-10',category:'Mano de obra',description:'Apoyo técnico',amount:100},{date:'2026-10-11',category:'Transporte y movilidad',description:'Traslado local',amount:30}],history:[]},
 {id:'PRO-0002',client:'Sodimac',zone:'Piura',store:'Sodimac Piura',responsible:'Carlos Pérez',description:'Instalación de suministro',type:'Suministro',quote:1800,estimate:1100,status:'Pendiente de documentos',docs:{quote:true,budget:true,report:false,act:false,oc:true,cert:false,migo:''},required:{quote:true,budget:true,report:false,act:true,oc:true,cert:false},docFiles:{},expenses:[{date:'2026-10-12',category:'Transporte y movilidad',description:'Traslado de materiales',amount:5}],history:[]}
 ],
 certificates:[
 {id:'CER-0001',client:'Maestro',zone:'Chiclayo',store:'Maestro Chiclayo',responsible:'Ana Torres',description:'Inspección de luces de emergencia',type:'Luces de emergencia',result:'Con observaciones',quote:900,estimate:450,status:'Pendiente de documentos',docs:{quote:true,budget:true,report:true,act:true,cert:false,oc:true,migo:'',},required:{quote:true,budget:true,report:true,act:true,cert:false,oc:true},docFiles:{},corrective:{fileName:'Presupuesto_correctivo.xlsx',amount:300,approval:'Pendiente',proof:''},expenses:[],history:[]}
 ],
 budgets:[]
};
function money(n){return 'S/ '+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusClass(s){return s==='Listo para facturar'?'ready':s==='Facturado'?'billed':s==='Anulado'?'cancel':s==='En registro'?'reg':'pending'}
function requiredDocs(item,isCert=false){let d=item.docs,r=item.required;let keys=isCert?['quote','budget','report','act','cert','oc']:['quote','budget','report','act','oc','cert'];return keys.filter(k=>r[k])}
const docLabels={quote:'Cotización PDF',budget:'Presupuesto Excel',report:'Informe técnico',act:'Acta de conformidad',cert:'Certificado',oc:'Orden de compra'};
function docReady(item,isCert=false){const keys=requiredDocs(item,isCert);return keys.every(k=>item.docs[k]===true)&&String(item.docs.migo||'').trim()!==''}
function docPercent(item,isCert=false){const keys=requiredDocs(item,isCert);const total=keys.length+1;const done=keys.filter(k=>item.docs[k]===true).length+(String(item.docs.migo||'').trim()!==''?1:0);return Math.round(done/total*100)}
function syncStatus(item,isCert=false){if(item.status==='Anulado')return;if(item.status==='Facturado')return;item.status=docReady(item,isCert)?'Listo para facturar':'Pendiente de documentos'}

function setView(v){state.view=v;state.selected=null;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===v));render()}
document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>setView(n.dataset.view)));
function heading(kicker,title,desc,button=''){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
const SI={'▣':'folder','✓':'check','▤':'filecheck','↗':'trend','!':'alert','▥':'sheet','≡':'list','S/':'coins'};
function stat(label,value,note,icon){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon"><i data-i="${SI[icon]||'file'}"></i></span></div><strong data-tip="${esc(value)}">${value}</strong><small>${note}</small></div>`}
function render(){document.getElementById('crumb').textContent=({projects:'Operaciones / Proyectos',certificates:'Operaciones / Certificados',budgets:'Operaciones / Presupuestos',dashboard:'Dashboard',crm:'CRM',billing:'Facturación',accounts:'Cuentas y saldos'})[state.view]||'Operaciones';document.getElementById('top-title').textContent=state.selected?'Ficha de '+state.selected:'Control operativo de servicios';
let c=document.getElementById('content');if(state.view==='projects')c.innerHTML=state.selected?projectDetail():projectList();else if(state.view==='certificates')c.innerHTML=state.selected?certificateDetail():certificateList();else if(state.view==='budgets')c.innerHTML=budgetList();else c.innerHTML=placeholder(state.view)}
function projectList(){let items=state.projects;let ready=items.filter(x=>x.status==='Listo para facturar').length,pending=items.filter(x=>x.status==='Pendiente de documentos').length;return `${heading('ÁREA OPERATIVA','Proyectos','Administra los servicios, sus documentos y la habilitación para facturar.','<button class="btn primary" onclick="newProject()"><i data-i="plus"></i>Nuevo proyecto</button>')}<div class="stats">${stat('Total de proyectos',items.length,'Registros operativos','▣')}${stat('Listos para facturar',ready,'Expedientes completos','✓')}${stat('Pendientes de documentos',pending,'Requieren completar el expediente','▤')}${stat('Gastos reales registrados',money(items.reduce((a,x)=>a+sumExpenses(x),0)),'Suma de gastos ingresados','↗')}</div><div class="panel"><div class="panel-head"><div><h2>Listado de proyectos</h2><p>Selecciona una fila para abrir la ficha completa.</p></div><span class="badge">${items.length} registros</span></div><div class="filters"><div class="field search"><label>Buscar</label><input id="p-search" placeholder="Código, cliente, zona o responsable" oninput="filterRows('p-table','p-search','p-status')"></div><div class="field"><label>Estado</label><select id="p-status" onchange="filterRows('p-table','p-search','p-status')"><option value="">Todos los estados</option>${['En registro','Pendiente de documentos','Listo para facturar','Facturado','Anulado'].map(s=>`<option>${s}</option>`).join('')}</select></div></div><div class="table-wrap"><table id="p-table"><thead><tr><th>Código</th><th>Cliente / Zona</th><th>Responsable</th><th>Servicio</th><th>Importe cotizado</th><th>Estado</th><th>Documentos</th><th></th></tr></thead><tbody>${items.map(p=>`<tr data-search="${esc((p.id+' '+p.client+' '+p.zone+' '+p.responsible+' '+p.description).toLowerCase())}" data-status="${esc(p.status)}" onclick="openItem('${p.id}','projects')"><td><span class="code">${p.id}</span></td><td><span class="client cell" data-tip="${esc(p.client)}">${esc(p.client)}</span><span class="subtext cell" data-tip="${esc(p.zone+(p.store?' · '+p.store:''))}">${esc(p.zone)}${p.store?' · '+esc(p.store):''}</span></td><td><span class="cell" data-tip="${esc(p.responsible)}">${esc(p.responsible)}</span></td><td><span class="cell" data-tip="${esc(p.description)}">${esc(p.description)}</span></td><td>${money(p.quote)}</td><td><span class="status ${statusClass(p.status)}">${p.status}</span></td><td><div class="progress"><div class="track"><span style="width:${docPercent(p)}%"></span></div><b>${docPercent(p)}%</b></div></td><td><button class="icon-btn" title="Abrir ficha" onclick="event.stopPropagation();openItem('${p.id}','projects')"><i data-i="open"></i></button></td></tr>`).join('')}</tbody></table></div><div class="footer-note">El porcentaje representa los requisitos documentales configurados y el código MIGO/HES. Datos de demostración editables durante esta sesión.</div></div>`}
function certificateList(){let items=state.certificates;return `${heading('ÁREA OPERATIVA','Certificados','Controla las inspecciones, el expediente documental y las observaciones.','<button class="btn primary" onclick="newCertificate()"><i data-i="plus"></i>Nuevo certificado</button>')}<div class="stats">${stat('Total de certificados',items.length,'Inspecciones registradas','▤')}${stat('Sin observaciones',items.filter(x=>x.result==='Sin observaciones').length,'Resultado de inspección','✓')}${stat('Con observaciones',items.filter(x=>x.result==='Con observaciones').length,'Requieren seguimiento','!')}${stat('Listos para facturar',items.filter(x=>x.status==='Listo para facturar').length,'Expedientes completos','↗')}</div><div class="panel"><div class="panel-head"><div><h2>Listado de certificados</h2><p>El resultado de inspección se mantiene separado del estado administrativo.</p></div><span class="badge">${items.length} registros</span></div><div class="filters"><div class="field search"><label>Buscar</label><input id="c-search" placeholder="Código, cliente, zona o responsable" oninput="filterRows('c-table','c-search','c-status')"></div><div class="field"><label>Estado</label><select id="c-status" onchange="filterRows('c-table','c-search','c-status')"><option value="">Todos los estados</option>${['En registro','Pendiente de documentos','Listo para facturar','Facturado','Anulado'].map(s=>`<option>${s}</option>`).join('')}</select></div></div><div class="table-wrap"><table id="c-table"><thead><tr><th>Código</th><th>Cliente / Zona</th><th>Responsable</th><th>Servicio inspeccionado</th><th>Resultado</th><th>Importe</th><th>Estado</th><th>Documentos</th><th></th></tr></thead><tbody>${items.map(p=>`<tr data-search="${esc((p.id+' '+p.client+' '+p.zone+' '+p.responsible+' '+p.description).toLowerCase())}" data-status="${esc(p.status)}" onclick="openItem('${p.id}','certificates')"><td><span class="code">${p.id}</span></td><td><span class="client cell" data-tip="${esc(p.client)}">${esc(p.client)}</span><span class="subtext cell" data-tip="${esc(p.zone+(p.store?' · '+p.store:''))}">${esc(p.zone)}${p.store?' · '+esc(p.store):''}</span></td><td><span class="cell" data-tip="${esc(p.responsible)}">${esc(p.responsible)}</span></td><td><span class="cell" data-tip="${esc(p.description)}">${esc(p.description)}</span></td><td><span class="status ${p.result==='Sin observaciones'?'ok':'pending'}">${p.result}</span></td><td>${money(p.quote)}</td><td><span class="status ${statusClass(p.status)}">${p.status}</span></td><td><div class="progress"><div class="track"><span style="width:${docPercent(p,true)}%"></span></div><b>${docPercent(p,true)}%</b></div></td><td><button class="icon-btn" onclick="event.stopPropagation();openItem('${p.id}','certificates')"><i data-i="open"></i></button></td></tr>`).join('')}</tbody></table></div><div class="footer-note">El certificado PDF se adjunta manualmente después de ser emitido por el departamento responsable.</div></div>`}
function filterRows(tableId,searchId,statusId){let q=(document.getElementById(searchId)?.value||'').toLowerCase(),s=document.getElementById(statusId)?.value||'';document.querySelectorAll('#'+tableId+' tbody tr').forEach(r=>r.style.display=((r.dataset.search||'').includes(q)&&(!s||r.dataset.status===s))?'':'none')}
function openItem(id,view){state.view=view;state.selected=id;state.tab='general';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));render()}
function getSelected(){return state.view==='certificates'?state.certificates.find(x=>x.id===state.selected):state.projects.find(x=>x.id===state.selected)}
function projectDetail(){
 let p=getSelected();if(!p)return projectList();
 let body=state.tab==='documents'?projectDocsDetail(p,false):state.tab==='budget'?projectBudgetDetail(p):state.tab==='history'?projectHistory(p):projectGeneralForm(p);
 return `${heading('PROYECTOS',p.id,'Ficha del servicio y seguimiento documental.','<button class="btn" onclick="goProjectList()"><i data-i="back"></i>Volver al listado</button>')}<div class="detail-layout"><div class="detail-main"><div class="detail-title"><div><h2>${esc(p.description)}</h2><p>${p.id} · ${esc(p.client)} / ${esc(p.zone)}</p></div><span class="status ${statusClass(p.status)}">${p.status}</span></div><div class="tabs"><button class="tab ${state.tab==='general'?'active':''}" onclick="state.tab='general';render()">Datos generales</button><button class="tab ${state.tab==='documents'?'active':''}" onclick="state.tab='documents';render()">Expediente documental</button><button class="tab ${state.tab==='budget'?'active':''}" onclick="state.tab='budget';render()">Presupuesto y gastos</button><button class="tab ${state.tab==='history'?'active':''}" onclick="state.tab='history';render()">Historial de modificaciones</button></div><div class="detail-body">${body}</div></div>${projectSide(p)}</div>`;
}
function projectGeneralForm(p){return `<h3 class="section-title">A. Datos generales</h3><div class="form-grid"><div class="field"><label>Código automático</label><input value="${p.id}" disabled></div><div class="field"><label>Tipo de operación</label><select id="pr-type"><option ${p.type==='Servicio'?'selected':''}>Servicio</option><option ${p.type==='Suministro'?'selected':''}>Suministro</option></select></div><div class="field"><label>Cliente (CRM)</label><select id="pr-client" onchange="refStore('pr')">${opt(state.clients,p.client)}</select></div><div class="field"><label>Zona (CRM)</label><select id="pr-zone" onchange="refStore('pr')">${opt(state.zones,p.zone)}</select></div> <div class="field"><label>Tienda (CRM)</label><select id="pr-store">${storeOpts(p.client,p.zone,p.store)}</select></div><div class="field"><label>Responsable del cliente (CRM)</label><select id="pr-resp">${opt(state.responsibles,p.responsible)}</select><div class="hint">Persona del cliente que aprobó el servicio.</div></div><div class="field wide"><label>Descripción del servicio</label><textarea id="pr-desc" maxlength="240" rows="2">${esc(p.description)}</textarea></div><div class="field"><label>Importe cotizado (S/)</label><input id="pr-quote" type="number" min="0" step=".01" value="${p.quote}"></div><div class="field"><label>Costo estimado (S/)</label><input id="pr-estimate" type="number" min="0" step=".01" value="${p.estimate}"></div></div><div style="display:flex;gap:9px;margin-top:18px;flex-wrap:wrap"><button class="btn primary" onclick="saveProjectGeneral('${p.id}')">Guardar datos</button><button class="btn soft" onclick="state.tab='documents';render()">Ir al expediente <i data-i="arrow-r"></i></button></div>`}

eholder="Número MIGO/HES" inputmode="numeric" style="max-width:180px;border:1px solid var(--line);padding:9px;border-radius:8px"><button class="btn small" onclick="saveMigo('${p.id}',true)">Guardar</button></div></div><div style="margin-top:15px"><button class="btn" onclick="state.certTab='general';render()"><i data-i="back"></i>Volver a datos generales</button></div></div></div>`;

function uploadDoc(id,key,input,isCert){if(!input.files||!input.files[0])return;let item=isCert?state.certificates.find(x=>x.id===id):state.projects.find(x=>x.id===id);let file=input.files[0];item.docs[key]=true;item.docNames=item.docNames||{};item.docNames[key]=file.name;item.docFiles=item.docFiles||{};if(item.docFiles[key]&&item.docFiles[key].url)URL.revokeObjectURL(item.docFiles[key].url);item.docFiles[key]={name:file.name,type:file.type,size:file.size,url:URL.createObjectURL(file)};syncStatus(item,isCert);toast('Archivo registrado: '+file.name);render()}

function newProject(){loadCRM();openModal('Nuevo proyecto',`<div class="form-grid"><div class="field"><label>Cliente (CRM) *</label><select id="new-client" onchange="refStore('new')">${opt(state.clients)}</select></div><div class="field"><label>Zona (CRM) *</label><select id="new-zone" onchange="refStore('new')">${opt(state.zones)}</select></div><div class="field"><label>Tienda (CRM)</label><select id="new-store">${storeOpts(state.clients[0],state.zones[0],'')}</select></div><div class="field"><label>Responsable del cliente *</label><select id="new-resp">${opt(state.responsibles)}</select></div> <div class="field"><label>Tipo de operación *</label><select id="new-type"><option>Servicio</option><option>Suministro</option></select></div><div class="field wide"><label>Descripción del servicio *</label><input id="new-desc" maxlength="240" placeholder="Describe el servicio"></div><div class="field"><label>Importe cotizado (S/) *</label><input id="new-quote" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Costo estimado (S/)</label><input id="new-estimate" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Cotización PDF *</label><input id="new-quote-file" type="file" accept=".pdf"></div><div class="field"><label>Presupuesto Excel *</label><input id="new-budget-file" type="file" accept=".xlsx,.xls"></div></div><p class="hint">El código se asignará automáticamente. Para el prototipo, los archivos se marcan como cargados en esta sesión.</p>`,()=>{let desc=document.getElementById('new-desc').value.trim();if(!desc){toast('Ingresa la descripción del servicio.');return false}if(!document.getElementById('new-quote-file').files[0]||!document.getElementById('new-budget-file').files[0]){toast('Adjunta la cotización PDF y el presupuesto Excel.');return false}let id=nextId('PRO',state.projects);let p={id,client:document.getElementById('new-client').value,zone:document.getElementById('new-zone').value,store:document.getElementById('new-store').value,responsible:document.getElementById('new-resp').value,description:desc,type:document.getElementById('new-type').value,quote:Number(document.getElementById('new-quote').value||0),estimate:Number(document.getElementById('new-estimate').value||0),status:'En registro',docs:{quote:true,budget:true,report:false,act:false,oc:false,cert:false,migo:''},required:{quote:true,budget:true,report:document.getElementById('new-type').value==='Servicio',act:true,oc:true,cert:false},expenses:[],docFiles:{},history:[{date:new Date().toLocaleString('es-PE'),action:'Creación',detail:'Proyecto creado con cotización y presupuesto iniciales.'}]};state.projects.unshift(p);state.budgets.push({id:p.id,kind:'Proyecto'});closeModal();state.view='projects';state.selected=p.id;state.tab='general';render();celebrate('Proyecto',id,'Presupuesto generado automáticamente');return true})}
function newCertificate(){loadCRM();openModal('Nuevo certificado',`<div class="form-grid"><div class="field"><label>Cliente (CRM) *</label><select id="nc-client" onchange="refStore('nc')">${opt(state.clients)}</select></div><div class="field"><label>Zona (CRM) *</label><select id="nc-zone" onchange="refStore('nc')">${opt(state.zones)}</select></div><div class="field"><label>Tienda (CRM)</label><select id="nc-store">${storeOpts(state.clients[0],state.zones[0],'')}</select></div><div class="field"><label>Responsable del cliente *</label><select id="nc-resp">${opt(state.responsibles)}</select></div> <div class="field"><label>Tipo de inspección *</label><input id="nc-type" maxlength="240" placeholder="Ej. luces de emergencia"></div><div class="field wide"><label>Descripción del servicio *</label><input id="nc-desc" maxlength="240" placeholder="Describe la inspección"></div><div class="field"><label>Importe cotizado (S/) *</label><input id="nc-quote" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Costo estimado (S/)</label><input id="nc-estimate" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Cotización PDF *</label><input id="nc-quote-file" type="file" accept=".pdf"></div><div class="field"><label>Presupuesto Excel *</label><input id="nc-budget-file" type="file" accept=".xlsx,.xls"></div></div><p class="hint">El código se asignará automáticamente. La cotización y el presupuesto son documentos iniciales.</p>`,()=>{let desc=document.getElementById('nc-desc').value.trim(),type=document.getElementById('nc-type').value.trim();if(!desc||!type){toast('Completa tipo de inspección y descripción.');return false}if(!document.getElementById('nc-quote-file').files[0]||!document.getElementById('nc-budget-file').files[0]){toast('Adjunta la cotización PDF y el presupuesto Excel.');return false}let id=nextId('CER',state.certificates);let p={id,client:document.getElementById('nc-client').value,zone:document.getElementById('nc-zone').value,store:document.getElementById('nc-store').value,responsible:document.getElementById('nc-resp').value,type,description:desc,quote:Number(document.getElementById('nc-quote').value||0),estimate:Number(document.getElementById('nc-estimate').value||0),result:'Sin observaciones',status:'En registro',docs:{quote:true,budget:true,report:false,act:false,cert:false,oc:false,migo:''},required:{quote:true,budget:true,report:false,act:true,cert:false,oc:true},corrective:{fileName:'',amount:0,approval:'Pendiente',proof:''},expenses:[],docFiles:{},history:[{date:new Date().toLocaleString('es-PE'),action:'Creación',detail:'Certificado creado con cotización y presupuesto iniciales.'}]};state.certificates.unshift(p);state.budgets.push({id:p.id,kind:'Certificado'});closeModal();state.view='certificates';state.selected=p.id;state.certTab='general';render();celebrate('Certificado',id,'Ficha económica generada');return true})}
function nextId(prefix,arr){let max=arr.reduce((m,x)=>Math.max(m,Number((x.id.match(/\d+$/)||['0'])[0])),0);return prefix+'-'+String(max+1).padStart(4,'0')}
function openModal(title,body,onSave){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal-backdrop').classList.add('show');document.getElementById('modal-save').onclick=onSave}
function closeModal(){document.getElementById('modal-backdrop').classList.remove('show')}
function addExpense(id,isCert){expenseModal(id,null,isCert)}
function editExpense(id,i,isCert){expenseModal(id,i,isCert)}
function expenseModal(id,index,isCert){let p=isCert?state.certificates.find(x=>x.id===id):state.projects.find(x=>x.id===id),e=index===null?{date:new Date().toISOString().slice(0,10),category:state.categories[0],description:'',amount:0}:p.expenses[index];openModal(index===null?'Registrar gasto real':'Editar gasto real',`<div class="form-grid"><div class="field"><label>Fecha *</label><input id="ex-date" type="date" value="${e.date}"></div><div class="field"><label>Categoría *</label><select id="ex-cat">${state.categories.map(x=>`<option ${x===e.category?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field wide"><label>Descripción *</label><input id="ex-desc" maxlength="240" value="${esc(e.description)}" placeholder="Ej. traslado local"></div><div class="field"><label>Importe (S/) *</label><input id="ex-amount" type="number" min="0" step=".01" value="${e.amount}"></div></div>`,()=>{let desc=document.getElementById('ex-desc').value.trim(),amount=Number(document.getElementById('ex-amount').value);if(!desc||amount<0||!Number.isFinite(amount)){toast('Completa la descripción y un importe válido.');return false}let obj={date:document.getElementById('ex-date').value,category:document.getElementById('ex-cat').value,description:desc,amount};if(index===null)p.expenses.push(obj);else p.expenses[index]=obj;closeModal();render();toast('Gasto guardado y totales actualizados.');return true})}
function deleteExpense(id,i,isCert){if(!confirm('¿Eliminar este gasto? El total del proyecto se recalculará.'))return;let p=isCert?state.certificates.find(x=>x.id===id):state.projects.find(x=>x.id===id);p.expenses.splice(i,1);render();toast('Gasto eliminado.')}
function editQuote(id){let p=state.projects.find(x=>x.id===id);openModal('Modificar cotización',`<div class="field"><label>Importe cotizado vigente (S/)</label><input id="quote-new" type="number" min="0" step=".01" value="${p.quote}"></div><div class="field" style="margin-top:13px"><label>Motivo de modificación aprobada *</label><textarea id="quote-reason" maxlength="240" rows="3" placeholder="Describe el cambio aprobado por el cliente"></textarea></div><p class="hint">Se conservará el importe anterior y el nuevo importe en el historial. Los gastos reales no se modificarán.</p>`,()=>{let old=p.quote,n=Number(document.getElementById('quote-new').value),reason=document.getElementById('quote-reason').value.trim();if(!reason){toast('Ingresa el motivo de la modificación.');return false}p.quote=n;p.history.push({date:new Date().toLocaleString('es-PE'),action:'Modificación de cotización',detail:`Anterior: ${money(old)}. Nuevo: ${money(n)}. Motivo: ${reason}`});closeModal();render();toast('Cotización actualizada con trazabilidad.');return true})}
function cancelItem(id,isCert){if(!confirm('¿Anular este registro? Se conservará en el listado.'))return;let p=isCert?state.certificates.find(x=>x.id===id):state.projects.find(x=>x.id===id);p.status='Anulado';p.history.push({date:new Date().toLocaleString('es-PE'),action:'Anulación',detail:'Registro anulado desde el prototipo.'});render();toast('Registro anulado; historial conservado.')}
function saveCorrective(id){let p=state.certificates.find(x=>x.id===id);let f=document.getElementById('corrective-file').files[0],proof=document.getElementById('corrective-proof').files[0];p.corrective=p.corrective||{};if(f)p.corrective.fileName=f.name;p.corrective.amount=Number(document.getElementById('corrective-amount').value||0);p.corrective.approval=document.getElementById('corrective-approval').value;if(proof)p.corrective.proof=proof.name;if(p.corrective.approval==='Aprobado'&&!p.corrective.fileName){toast('Adjunta el presupuesto correctivo antes de marcarlo aprobado.');return}toast('Presupuesto correctivo guardado.');render()}
function previewCorrective(input){document.getElementById('corrective-name').textContent=input.files[0]?.name||'Ningún archivo adjunto'}
function createCorrectiveProject(id){let c=state.certificates.find(x=>x.id===id);if(!c.corrective||c.corrective.approval!=='Aprobado'||!c.corrective.fileName){toast('Para crear el proyecto, adjunta el presupuesto y marca la aprobación como Aprobado.');return}if(c.corrective.projectId){toast('Ya existe un proyecto vinculado: '+c.corrective.projectId);return}let pid=nextId('PRO',state.projects);let p={id:pid,client:c.client,zone:c.zone,store:c.store,responsible:c.responsible,description:'Levantamiento de observaciones: '+c.description,type:'Servicio',quote:c.corrective.amount,estimate:c.corrective.amount,status:'En registro',docs:{quote:true,budget:true,report:false,act:false,oc:false,cert:false,migo:''},required:{quote:true,budget:true,report:true,act:true,oc:true,cert:false},expenses:[],docFiles:{},history:[{date:new Date().toLocaleString('es-PE'),action:'Creación desde certificado',detail:'Proyecto correctivo vinculado a '+c.id}] ,sourceCertificate:c.id};state.projects.unshift(p);state.budgets.push({id:p.id,kind:'Proyecto'});c.corrective.projectId=pid;celebrate('Proyecto',pid,'Vinculado al certificado '+c.id);state.view='projects';state.selected=pid;state.tab='general';render()}
function budgetList(){let all=[...state.projects.map(p=>({...p,kind:'Proyecto'})),...state.certificates.map(p=>({...p,kind:'Certificado'}))];return `${heading('ÁREA OPERATIVA','Presupuestos','Cada proyecto o certificado genera automáticamente una ficha económica independiente.')}<div class="stats">${stat('Fichas económicas',all.length,'Una por registro operativo','▥')}${stat('Gastos reales',money(all.reduce((a,x)=>a+sumExpenses(x),0)),'Suma de gastos manuales','↗')}${stat('Categorías activas',state.categories.length,'Configurables','≡')}${stat('Registros operativos',state.projects.length+state.certificates.length,'Proyectos y certificados','▣')}</div><div class="panel"><div class="panel-head"><div><h2>Fichas económicas</h2><p>Abre una ficha para consultar el presupuesto estimado, los gastos y la rentabilidad.</p></div><button class="btn soft" onclick="manageCategories()"><i data-i="settings"></i>Gestionar categorías</button></div><div class="filters"><div class="field search"><label>Buscar</label><input id="b-search" placeholder="Código, cliente o zona" oninput="filterBudget()"></div></div><div class="table-wrap"><table id="b-table"><thead><tr><th>Código</th><th>Origen</th><th>Cliente / Zona</th><th>Importe cotizado</th><th>Costo estimado</th><th>Gastos reales</th><th>Margen provisional</th><th></th></tr></thead><tbody>${all.map(p=>`<tr data-search="${esc((p.id+' '+p.client+' '+p.zone).toLowerCase())}"><td><span class="code">${p.id}</span></td><td>${p.kind}</td><td><span class="client cell" data-tip="${esc(p.client)}">${esc(p.client)}</span><span class="subtext cell" data-tip="${esc(p.zone+(p.store?' · '+p.store:''))}">${esc(p.zone)}${p.store?' · '+esc(p.store):''}</span></td><td>${money(p.quote)}</td><td>${money(p.estimate)}</td><td>${money(sumExpenses(p))}</td><td>${money(p.quote-sumExpenses(p))}</td><td><button class="btn small" onclick="openBudgetSource('${p.id}','${p.kind}')">Abrir ficha</button></td></tr>`).join('')}</tbody></table></div><div class="footer-note">Los gastos se registran dentro de la ficha de cada proyecto o certificado. Los importes de ejemplo no son datos reales.</div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>Categorías de gastos editables</h2><p>Mano de obra incluye los pagos a técnicos independientes.</p></div><button class="btn" onclick="manageCategories()">Editar categorías</button></div><div class="detail-body"><div class="category-list">${state.categories.map(x=>`<span class="category-chip">${esc(x)}</span>`).join('')}</div></div></div>`}
function filterBudget(){let q=document.getElementById('b-search').value.toLowerCase();document.querySelectorAll('#b-table tbody tr').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none')}
function openBudgetSource(id,kind){if(kind==='Proyecto'){state.view='projects';state.selected=id;state.tab='budget'}else{state.view='certificates';state.selected=id;state.certTab='budget'}document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===state.view));render()}
function manageCategories(){openModal('Gestionar categorías de gastos',`<div class="field"><label>Agregar nueva categoría</label><div style="display:flex;gap:8px"><input id="new-category" placeholder="Nombre de categoría"><button class="btn soft" onclick="addCategory()">Añadir</button></div></div><div style="margin-top:17px"><label class="muted" style="font-size:12px;font-weight:700">Categorías actuales</label><div class="category-list" style="margin-top:9px">${state.categories.map((x,i)=>`<span class="category-chip">${esc(x)} <button onclick="removeCategory(${i})" title="Eliminar categoría"><i data-i="x" data-s="13"></i></button></span>`).join('')}</div></div><p class="hint">No elimines categorías que ya estén siendo usadas por gastos si quieres mantener sus agrupaciones.</p>`,()=>{closeModal();render();return true})}
function addCategory(){let v=document.getElementById('new-category').value.trim();if(v&&!state.categories.includes(v)){state.categories.push(v);manageCategories();toast('Categoría añadida.')}else toast('Escribe una categoría nueva.')}
function removeCategory(i){let cat=state.categories[i];if(!confirm('¿Eliminar la categoría '+cat+'?'))return;let used=[...state.projects,...state.certificates].some(p=>p.expenses.some(e=>e.category===cat));if(used){toast('Esta categoría ya tiene gastos registrados. Cambia esos gastos de categoría antes de eliminarla.');return}state.categories.splice(i,1);manageCategories();toast('Categoría eliminada.')}
function placeholder(v){let names={dashboard:['Dashboard','Resumen general del ERP'],crm:['CRM','En esta maqueta, el CRM funciona como fuente de selección de clientes, zonas, tiendas y responsables.'],billing:['Facturación','La integración real con facturación se implementará en la siguiente etapa.'],accounts:['Cuentas y saldos','Módulo mostrado como referencia de navegación.']};let a=names[v]||['Módulo','Vista de demostración'];return `${heading('ERP CARZE',a[0],a[1])}<div class="panel"><div class="detail-body"><div class="callout">Esta vista es únicamente de referencia en el prototipo de Operaciones y Servicios. Los datos de CRM de esta maqueta son de demostración; la integración real se realizará cuando se conecten los módulos.</div></div></div>`}

/* ===== CARZE · integración CRM, persistencia y UX ===== */
const $=id=>document.getElementById(id);
const FB={clients:state.clients.slice(),zones:state.zones.slice(),responsibles:state.responsibles.slice(),stores:[{nombre:'Tottus Lima Centro',cliente:'Tottus',zona:'Lima'},{nombre:'Sodimac Piura',cliente:'Sodimac',zona:'Piura'},{nombre:'Maestro Chiclayo',cliente:'Maestro',zona:'Chiclayo'}]};
const crmGet=k=>{try{const v=JSON.parse(localStorage.getItem('carze_'+k));return Array.isArray(v)?v:[]}catch(e){return[]}};
function loadCRM(){const act=a=>a.filter(r=>r&&r.estado!=='Inactivo'),u=a=>[...new Set(a.map(x=>String(x||'').trim()).filter(Boolean))];
const c=u(act(crmGet('Clientes')).map(r=>r.comercial||r.razon)),z=u(act(crmGet('Zonas')).map(r=>r.nombre)),r=u(act(crmGet('Responsables')).map(r=>r.nombre)),s=act(crmGet('Tiendas')).filter(t=>t.nombre).map(t=>({nombre:t.nombre,cliente:t.cliente||'',zona:t.zona||''}));
state.clients=c.length?c:FB.clients;state.zones=z.length?z:FB.zones;state.responsibles=r.length?r:FB.responsibles;state.stores=s.length?s:FB.stores;state.crm=!!(c.length||z.length||r.length||s.length)}
const opt=(list,cur)=>(cur&&!list.includes(cur)?[cur,...list]:list).map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('');
function storeOpts(c,z,cur){const lc=x=>String(x||'').trim().toLowerCase();let l=state.stores.filter(s=>lc(s.cliente)===lc(c));const lz=l.filter(s=>lc(s.zona)===lc(z));if(lz.length)l=lz;const n=l.map(s=>s.nombre);return'<option value="">Sin tienda asignada</option>'+opt(cur&&!n.includes(cur)?[cur,...n]:n,cur)}
function refStore(px){$(px+'-store').innerHTML=storeOpts($(px+'-client').value,$(px+'-zone').value,'')}
try{const o=JSON.parse(localStorage.getItem('carze_ops')||'null');if(o&&o.projects&&o.certificates){state.projects=o.projects;state.certificates=o.certificates;state.categories=o.categories||state.categories;state.budgets=o.budgets||[]}}catch(e){}
const strip=a=>a.map(x=>({...x,docFiles:{}}));
const persist=()=>{try{localStorage.setItem('carze_ops',JSON.stringify({projects:strip(state.projects),certificates:strip(state.certificates),categories:state.categories,budgets:state.budgets}))}catch(e){}};
// Toasts
function toast(msg){const err=/^(Ingresa|Completa|Adjunta|El código debe|Para crear|Esta categoría|Escribe|Ya existe)/.test(msg),t=document.createElement('div');t.className='toast'+(err?' err':'');t.innerHTML=ic(err?'alert':'check',18)+'<span></span><i class="life"></i>';t.querySelector('span').textContent=msg;$('toasts').appendChild(t);requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('in')));setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.remove(),200)},2800)}
// Celebración de creación (proyecto / certificado)
function celebrate(kind,code,sub){gq='';if($('gsearch'))$('gsearch').value='';const w=document.createElement('div');w.className='cele';w.setAttribute('role','status');w.innerHTML=`<div class="cele-card"><div class="cele-ic"><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="m15 27 8 8 15-17"/></svg>${Array.from({length:10},(_,i)=>`<s style="--a:${i*36}deg"></s>`).join('')}</div><div class="cele-tx"><b>¡${kind} ${esc(code)} creado correctamente!</b><small>${esc(sub||'')}</small></div><i class="cele-bar"></i></div>`;document.body.appendChild(w);setTimeout(()=>{w.classList.add('out');setTimeout(()=>w.remove(),220)},3600)}
// Render con transiciones, estagger y sincronía
let lastKey,gq='';const _render=render;
render=function(){loadCRM();_render();const c=$('content'),key=[state.view,state.selected,state.tab,state.certTab].join('|');c.classList.toggle('fx',key!==lastKey);lastKey=key;
document.querySelectorAll('#content tbody').forEach(tb=>[...tb.rows].forEach((r,i)=>r.style.setProperty('--i',Math.min(i,12))));
const s=document.querySelector('#p-search,#c-search,#b-search');if(s&&gq){s.value=gq;s.dispatchEvent(new Event('input'))}
$('sync').innerHTML=ic('link',13)+(state.crm?`CRM sincronizado · ${state.clients.length} clientes`:'Datos de respaldo');$('sync').classList.toggle('off',!state.crm);hydrate();persist()};
function restag(tb){if(!tb)return;let i=0;[...tb.rows].forEach(r=>{if(r.style.display!=='none')r.style.setProperty('--i',Math.min(i++,12))});tb.classList.remove('stg');void tb.offsetWidth;tb.classList.add('stg')}
const _fr=filterRows;filterRows=function(t,...a){_fr(t,...a);restag($(t).tBodies[0])};
const _fb=filterBudget;filterBudget=function(){_fb();restag($('b-table').tBodies[0])};
const _om=openModal;openModal=function(...a){_om(...a);hydrate();setTimeout(()=>$('modal-body').querySelector('input,select,textarea')?.focus({preventScroll:true}),60)};
const _cm=closeModal;closeModal=function(){_cm()};
document.addEventListener('input',e=>{if(/^(p|c|b)-search$/.test(e.target.id)){gq=e.target.value;$('gsearch').value=gq}});
$('gsearch').addEventListener('input',e=>{gq=e.target.value;if(!['projects','certificates','budgets'].includes(state.view)){setView('projects')}else if(state.selected){state.selected=null;render()}const s=document.querySelector('#p-search,#c-search,#b-search');if(s){s.value=gq;s.dispatchEvent(new Event('input'))}});
$('modal-backdrop').addEventListener('mousedown',e=>{if(e.target===$('modal-backdrop'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='/'&&!e.metaKey&&!e.ctrlKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('gsearch').focus()}});
$('theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('carze_theme',t)}catch(e){}};
addEventListener('storage',e=>{if(e.key&&/^carze_(Clientes|Zonas|Tiendas|Responsables)$/.test(e.key)&&!$('modal-backdrop').classList.contains('show'))render()});
// Tooltips y texto expandible
const tip=$('tip');document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(!el||!el.dataset.tip||el.scrollWidth<=el.clientWidth)return;tip.textContent=el.dataset.tip;const r=el.getBoundingClientRect();tip.classList.add('show');const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=(r.top-h-8<8?r.bottom+8:r.top-h-8)+'px'});
document.addEventListener('mouseout',e=>{if(e.target.closest?.('[data-tip]'))tip.classList.remove('show')});document.addEventListener('scroll',()=>tip.classList.remove('show'),true);
document.addEventListener('click',e=>{const c=e.target.closest('.cell.exp');if(c){c.classList.toggle('open');tip.classList.remove('show');e.stopPropagation()}},true);
hydrate();render();

</script>
